<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14315f">
<title>Myrah — jobs</title>
<!--
  Mercy's operator board. MYRAH_OPERATIONS_DESIGN.md §3c: "one glance = the
  whole business".

  BRAND: the same tokens as the customer calculator (apps/web/src/styles/
  index.css) -- navy #14315F, green #3F9D24, mist #F4F6FA, 1rem card radius,
  system font stack. The first version of this board used an unrelated dark
  palette and read as a dev tool; this is Myrah's own language, so Mercy and her
  customers are looking at the same business.

  HUMAN-FIRST: cards show a plain-language service line, never the raw basket
  JSON. Mercy reads "Sofa - 3 seats - Mattress 5x6 - + Fridge", not
  {"items":[{"service":"sofa","seats":3}]}.
-->
<style>
  :root{
    --navy:#14315f; --navy-deep:#0f2549; --green:#3f9d24; --green-deep:#35841e;
    --ink:#0f1b2d; --mist:#f4f6fa; --line:#dde3ee; --muted:#5c6b84;
    /* Darkened from #b7791f: on the #fdf4e4 / #fff4e5 pill grounds that
       was about 3.2:1, under the 4.5:1 a caption needs. This clears it,
       and the three amber captions now share the one token. */
    --amber:#8a5a00; --red:#b3261e; --radius:1rem;
    /* The customer app draws every surface as `ring-1 ring-navy/10` plus
       `shadow-sm` (apps/web/src/components/ui.tsx <Card>). Kept here as one
       shadow so the hairline and the lift can never drift apart, and so the
       board and the calculator sit on the same plane. */
    --ring:0 0 0 1px rgba(20,49,95,.10);
    --ring-strong:0 0 0 1px rgba(20,49,95,.18);
    --lift:0 1px 2px rgba(20,49,95,.05);
    --lift-lg:0 2px 4px rgba(20,49,95,.06),0 4px 12px rgba(20,49,95,.05);
    --sel:inset 0 0 0 2px var(--green);        /* = ring-2 ring-green */
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--mist);color:var(--ink);
       font:16px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
       font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%}
  :focus-visible{outline:2px solid var(--green);outline-offset:2px}
  @media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}

  /* -- header ------------------------------------------------------------ */
  header{background:linear-gradient(180deg,var(--navy) 0%,var(--navy-deep) 100%);
         color:#fff;padding:14px 14px 15px;padding-top:calc(14px + env(safe-area-inset-top))}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;
         max-width:640px;margin:0 auto}
  .lockup{display:flex;align-items:center;gap:11px;min-width:0}
  .hbtns{display:flex;align-items:center;gap:8px;flex:0 0 auto}
  .hbtns .act.sm{margin-top:0;padding:0 13px;background:rgba(255,255,255,.10);
                 border:1px solid rgba(255,255,255,.24)!important;color:#fff;
                 border-radius:.7rem;font-weight:650}
  .hbtns .act.sm:active{background:rgba(255,255,255,.18)}
  .mark{width:40px;height:40px;flex:0 0 40px;display:block}
  .brand h1{margin:0;font-size:19px;font-weight:800;letter-spacing:-.015em;line-height:1.15}
  .brand h1 span{color:#9fd98c;font-weight:700}
  .sub{opacity:.78;font-size:12.5px;margin-top:3px;line-height:1.35}
  .newq{background:var(--green);color:#fff;border:0;border-radius:.7rem;
        padding:11px 15px;font-size:14.5px;font-weight:700;min-height:44px;cursor:pointer;
        box-shadow:0 1px 2px rgba(0,0,0,.16)}
  .newq:active{background:var(--green-deep)}
  /* On a narrow phone the lockup and both buttons cannot share one row without
     squeezing a button under its 44px tap minimum. Give the buttons their own
     full-width row rather than shrinking them -- Mercy works one-handed. */
  @media (max-width:429px){
    .brand{flex-direction:column;align-items:stretch;gap:11px}
    .hbtns{width:100%}
    .hbtns>*{flex:1 1 0}
  }

  /* -- tabs -------------------------------------------------------------- */
  .tabs{display:flex;gap:7px;overflow-x:auto;padding:11px 12px;background:#fff;
        border-bottom:1px solid var(--line);position:sticky;top:0;z-index:4;
        scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .tabs::-webkit-scrollbar{display:none}
  .tab{flex:0 0 auto;display:inline-flex;align-items:center;gap:7px;
       border:1px solid var(--line);background:#fff;color:var(--muted);
       border-radius:999px;padding:0 13px;font-size:13.5px;font-weight:650;
       min-height:42px;cursor:pointer;font-family:inherit;
       transition:background .12s,color .12s,border-color .12s}
  .tab:active{background:var(--mist)}
  .tab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
  /* The count was a dimmed number butted against the label, so it read as part
     of the word ("Today3"). A badge separates the two at a glance. */
  .tab .n{display:inline-flex;align-items:center;justify-content:center;
          min-width:20px;height:20px;padding:0 6px;border-radius:999px;
          background:var(--mist);color:var(--muted);font-size:11.5px;font-weight:700}
  .tab[aria-selected="true"] .n{background:rgba(255,255,255,.22);color:#fff}

  /* -- the board --------------------------------------------------------- */
  main{padding:14px 12px 48px;max-width:640px;margin:0 auto}
  .card{background:#fff;border:0;border-radius:var(--radius);
        padding:15px 15px 14px;margin-bottom:10px;cursor:pointer;
        box-shadow:var(--ring),var(--lift);transition:box-shadow .12s,background .12s}
  .card:active{background:#fbfcfe;box-shadow:var(--ring-strong),var(--lift-lg)}
  .top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
  .idn{flex:1;min-width:0}
  .who{display:block;font-weight:800;font-size:17px;color:var(--navy);
       letter-spacing:-.01em;line-height:1.25;overflow-wrap:anywhere}
  .rt{display:flex;align-items:center;gap:7px;flex:0 0 auto;padding-top:1px}
  .amt{font-weight:800;font-size:17px;white-space:nowrap;color:var(--navy);letter-spacing:-.015em}
  .chev{width:16px;height:16px;flex:0 0 16px;color:#7a8ba6}   /* 3.46:1 on white */
  .svc{margin-top:6px;font-size:14.5px;line-height:1.45;color:#33425c}
  /* WHERE and WHEN each carry a small mark so the eye can find them without
     reading the whole line -- they are the two things she scans a card for. */
  .meta{margin-top:9px;display:flex;flex-wrap:wrap;align-items:center;gap:5px 12px;
        font-size:13px;color:var(--muted)}
  .mi{display:inline-flex;align-items:center;gap:5px;min-width:0}
  .mi svg{width:13px;height:13px;flex:0 0 13px}   /* currentColor: inherits .meta */
  .ref{margin-left:auto;font-size:11px;color:var(--muted);letter-spacing:.05em;font-weight:700;
       background:var(--mist);border-radius:6px;padding:3px 7px;white-space:nowrap}
  .pills{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
  .pill{font-size:11.5px;font-weight:700;padding:5px 10px;border-radius:8px;line-height:1.3}
  .pill.need{background:#fdf4e4;color:var(--amber)}
  .pill.ok{background:#eaf6e5;color:var(--green-deep)}
  .pill.owe{background:#fdeceb;color:var(--red)}
  .pill.note{background:#eef2f9;color:var(--navy)}
  .pill.flag{background:#fff4e5;color:var(--amber)}
  .empty{color:var(--muted);text-align:center;padding:46px 16px;font-size:14.5px;
         background:#fff;border-radius:var(--radius);box-shadow:var(--ring)}

  /* -- buttons ----------------------------------------------------------- */
  button.act{width:100%;min-height:50px;border-radius:.7rem;border:0;font-size:15.5px;
             font-weight:700;margin-top:10px;cursor:pointer;font-family:inherit;
             transition:background .12s,box-shadow .12s}
  .primary{background:var(--green);color:#fff;box-shadow:0 1px 2px rgba(20,49,95,.10)}
  .primary:active{background:var(--green-deep)}
  .navy{background:var(--navy);color:#fff;box-shadow:0 1px 2px rgba(20,49,95,.10)}
  .navy:active{background:var(--navy-deep)}
  .ghost{background:#fff;border:1px solid var(--line)!important;color:var(--navy)}
  .ghost:active{background:var(--mist)}

  /* -- sheet ------------------------------------------------------------- */
  dialog{border:0;border-radius:var(--radius);padding:0;width:min(94vw,470px);
         color:var(--ink);box-shadow:0 20px 50px rgba(15,37,73,.28)}
  dialog::backdrop{background:rgba(15,37,73,.48)}
  .sheet{padding:18px}
  .sheet h2{margin:0;font-size:19px;color:var(--navy);font-weight:800;letter-spacing:-.015em}
  label{display:block;font-size:11.5px;color:var(--muted);margin:15px 0 6px;font-weight:800;
        text-transform:uppercase;letter-spacing:.06em}
  input,select,textarea{width:100%;padding:12px 13px;border:1px solid var(--line);
        border-radius:.7rem;font-size:16px;background:#fff;font-family:inherit;color:var(--ink);
        transition:border-color .12s,box-shadow .12s}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green);
        box-shadow:0 0 0 2px rgba(63,157,36,.28)}
  textarea{min-height:80px;resize:vertical;line-height:1.45}
  .msg{margin-top:12px;padding:12px 13px;border-radius:.7rem;font-size:14px;
       display:none;line-height:1.45}
  .msg.err{display:block;background:#fdeceb;color:var(--red)}
  .msg.good{display:block;background:#eaf6e5;color:var(--green-deep)}
  .totals{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .totals div{display:flex;justify-content:space-between;padding:5px 0;font-size:14.5px}
  .totals .big{font-weight:800;font-size:17px;color:var(--navy)}
  .log{margin-top:12px;font-size:12.5px;color:var(--muted);line-height:1.5}
  .log div{padding:5px 0;border-top:1px dashed var(--line)}
  .when{font-size:13px;color:var(--muted);line-height:1.45}

  /* -- service picker ------------------------------------------------------
     A deliberate port of the customer's card (apps/web/src/components/
     ServiceCard.tsx): icon, bold navy title, price beneath it, and a
     thumb-sized check column on the right that says "Add" / "Added".

     TWO BUGS THIS FIXES, both from .pickchip being a <label> and so inheriting
     the form-label rule above: service names rendered UPPERCASE at 12.5px in
     muted grey, and every row carried `margin:14px 0 5px` ON TOP of the grid
     gap, so the spacing was uneven. Both are reset explicitly below.

     WHY THE WHOLE CARD TOGGLES, unlike the customer's: the customer card
     splits body-from-checkbox because tapping the body opens an explanation.
     There is no explanation panel here -- Mercy already knows what "Sofa"
     means -- so the entire card is the target, which is faster one-handed. */
  .pickgrid{display:flex;flex-direction:column;gap:8px;margin:8px 0 2px}
  .pickchip{display:flex;align-items:stretch;min-height:64px;margin:0;padding:0;
            background:#fff;border:0;border-radius:12px;cursor:pointer;overflow:hidden;
            font-size:15px;font-weight:400;color:var(--ink);
            text-transform:none;letter-spacing:normal;
            box-shadow:var(--ring),var(--lift);transition:box-shadow .12s}
  .pickchip:active{box-shadow:var(--ring-strong),var(--lift)}
  .pickchip.on{box-shadow:var(--sel),var(--lift)}
  .pickchip input[type=checkbox]{position:absolute;width:1px;height:1px;padding:0;margin:-1px;
            overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
  .pkbody{flex:1;display:flex;align-items:center;gap:11px;padding:11px 13px;min-width:0}
  .pkico{font-size:22px;line-height:1;flex:0 0 auto}
  .pktxt{min-width:0}
  .pickchip .nm{display:block;font-weight:700;font-size:15px;color:var(--navy);
                line-height:1.3;overflow-wrap:anywhere}
  .pickchip .ph{display:block;font-size:13px;color:var(--muted);margin-top:2px;line-height:1.3}
  .pkbox{flex:0 0 66px;display:flex;flex-direction:column;align-items:center;
         justify-content:center;gap:3px;border-left:1px solid var(--line);
         transition:background .12s,border-color .12s}
  .pickchip.on .pkbox{border-left-color:rgba(63,157,36,.30);background:rgba(63,157,36,.06)}
  .pkmark{width:28px;height:28px;border-radius:8px;background:#fff;color:#fff;
          box-shadow:inset 0 0 0 2px rgba(20,49,95,.20);
          display:flex;align-items:center;justify-content:center;
          transition:background .12s,box-shadow .12s}
  .pickchip.on .pkmark{background:var(--green);box-shadow:none}
  .pkmark svg{width:19px;height:19px;display:none}
  .pickchip.on .pkmark svg{display:block}
  .pklab{font-size:10.5px;font-weight:700;color:var(--muted);letter-spacing:.02em}
  .pickchip.on .pklab{color:var(--green-deep)}

  /* -- composer groups + controls ---------------------------------------- */
  .grp{border:0;border-radius:14px;padding:13px;margin:10px 0;background:#fff;
       box-shadow:var(--ring),var(--lift)}
  .grph{font-weight:800;color:var(--navy);margin-bottom:9px;font-size:15px;
        letter-spacing:-.01em}
  .line+.line{border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
  .lineh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;
         font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);
         font-weight:700}
  .rm{min-height:44px;padding:0 6px;background:none;border:0;color:#b42318;
      text-decoration:underline;font-size:13px;cursor:pointer;font-family:inherit}
  .chips{display:flex;flex-wrap:wrap;gap:7px;margin:7px 0}
  /* Mirrors the customer's <Chip> (ui.tsx): pill, navy fill when selected. */
  .tchip{min-height:44px;padding:9px 13px;border:1px solid var(--line);border-radius:999px;
         background:#fff;font-size:13px;font-weight:600;color:var(--navy);cursor:pointer;
         font-family:inherit;transition:background .12s,border-color .12s,color .12s}
  .tchip:active{background:var(--mist)}
  .tchip.on{background:var(--navy);border-color:var(--navy);color:#fff}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;
       min-height:48px;font-size:14px;color:var(--ink)}
  .ctr{display:flex;align-items:center;gap:6px;flex:0 0 auto}
  /* Round, like the customer's <Counter>. */
  .ctr button{width:44px;height:44px;border:1px solid var(--line);border-radius:999px;
              background:#fff;font-size:19px;line-height:1;color:var(--navy);font-weight:700;
              cursor:pointer;font-family:inherit}
  .ctr button:active{background:var(--mist)}
  .ctr b{min-width:26px;text-align:center;font-variant-numeric:tabular-nums;font-size:15px}
  .vbadge{display:inline-block;margin:2px 0 6px;padding:5px 9px;border-radius:8px;
          background:#fff4e5;color:var(--amber);font-size:12px;font-weight:600}
  .act.sm{min-height:44px;font-size:13px;margin-top:8px}
  .detbtn{min-height:44px;padding:0 4px;background:none;border:0;color:var(--muted);
          font-size:12px;text-decoration:underline;cursor:pointer;font-family:inherit}
  .det{border-top:1px dashed var(--line);margin-top:8px;padding-top:8px}
  .det textarea{width:100%;min-height:60px;padding:9px;font:inherit;font-size:13px;
                border:1px solid var(--line);border-radius:10px}
  .det input{width:100%;min-height:44px;padding:9px;font:inherit;font-size:13px;
             border:1px solid var(--line);border-radius:10px;margin-top:6px}
  .prow{display:flex;align-items:center;gap:8px;min-height:48px}
  .plab{flex:1;font-size:13px;color:var(--ink);min-width:0}
  .pauto{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .pauto.struck{text-decoration:line-through}
  .povr{width:92px;min-height:44px;padding:7px 9px;text-align:right;font:inherit;
        font-size:13px;border:1px solid var(--line);border-radius:10px}
  input.plab{min-height:44px;padding:7px 9px;border:1px solid var(--line);border-radius:10px}
</style>
</head>
<body>
<header>
  <div class="brand">
    <div class="lockup">
      <!-- The same mark as the Facebook profile picture: navy field, white M,
           green four-point sparkle. Kept navy-on-navy with a faint ring rather
           than inverted to white, so the board carries the REAL mark and not a
           second version of it. Inline SVG: one file, no extra request, and it
           stays sharp on a phone at any density. -->
      <svg class="mark" viewBox="0 0 40 40" aria-hidden="true">
        <rect x=".75" y=".75" width="38.5" height="38.5" rx="10"
              fill="#14315F" stroke="rgba(255,255,255,.28)" stroke-width="1.5"/>
        <text x="15.5" y="28" text-anchor="middle" fill="#fff"
              font-family="ui-sans-serif,system-ui,'Segoe UI',Roboto,sans-serif"
              font-size="22" font-weight="900">M</text>
        <!-- Sits in the negative space above the M's right shoulder. The first
             pass overlapped that arm -- the same mistake the profile picture
             made before its sparkle was moved clear. -->
        <path d="M32.5 6 L33.6 9.4 L37 10.5 L33.6 11.6 L32.5 15
                 L31.4 11.6 L28 10.5 L31.4 9.4 Z" fill="#3F9D24"/>
      </svg>
      <div>
        <h1>Myrah <span>· jobs</span></h1>
        <div class="sub" id="sub">loading…</div>
      </div>
    </div>
    <div class="hbtns">
      <button class="act ghost sm" id="zones">Transport</button>
      <button class="newq" id="newq">+ Quote</button>
    </div>
  </div>
</header>

<div class="tabs" id="tabs" role="tablist"></div>
<main id="list"></main>
<dialog id="sheet"><div class="sheet" id="sheetBody"></div></dialog>

<script>
const API="/api/admin";
const money=c=>"KSh "+(c/100).toLocaleString("en-KE",{maximumFractionDigits:0});
const COLS=["today","new","quoted","booked","done","unpaid"];
const LABEL={today:"Today",new:"New",quoted:"Quoted",booked:"Booked",done:"Done",unpaid:"Unpaid"};

/* Inline SVG, not an icon font or a sprite request: this page is one file
   served off disk, and a phone on Kenyan mobile data should not wait on a
   second round trip to find out WHERE a job is. `currentColor` throughout so
   each mark inherits the tone of the row it sits in. */
const I_PIN=`<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.7c-2.4 0-4.3 1.9-4.3 4.3 0 3.2 4.3 8.3 4.3 8.3s4.3-5.1 4.3-8.3c0-2.4-1.9-4.3-4.3-4.3Z" fill="none" stroke="currentColor" stroke-width="1.4"/><circle cx="8" cy="5.9" r="1.5" fill="currentColor"/></svg>`;
const I_CAL=`<svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.2" y="3.4" width="11.6" height="10.4" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><path d="M2.2 6.7h11.6M5.4 2.2v2.4M10.6 2.2v2.4" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>`;
/* Says "this card opens" -- the old card gave no affordance at all. */
const I_CHEV=`<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
/* The same tick path the customer's ServiceCard draws, so a ticked service
   looks identical on both surfaces. */
const I_TICK=`<svg viewBox="0 0 20 20" aria-hidden="true"><path d="M5 10.5 8.5 14 15 6.5" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
let S={board:null,col:"today",pin:sessionStorage.getItem("myrah_pin")||"",cat:null};

const hdrs=()=>({"Content-Type":"application/json","X-Admin-PIN":S.pin});
async function api(p,o={}){
  const r=await fetch(API+p,{headers:hdrs(),...o});
  if(r.status===401){askPin(true);throw new Error("pin");}
  return r;
}
// Surface what the SERVER said. The first version swallowed a perfectly clear
// "choose a size for curtains" and showed "Could not price that" instead.
async function reason(r){
  try{const j=await r.json();return j.detail||j.reason||`request failed (${r.status})`;}
  catch{return `request failed (${r.status})`;}
}

/* "2026-08-25 morning" is a timestamp; "Today · morning" is a plan. Mercy is
   reading this one-handed in a hallway, so it says the second kind. Anything
   this cannot parse is passed through untouched rather than guessed at. */
const DAYS=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const MONS=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function whenLine(raw){
  if(!raw) return "not scheduled";
  const m=String(raw).match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\w+))?/);
  if(!m) return raw;
  const [_,y,mo,d,win]=m;
  // Built from parts, not Date.parse -- "2026-08-25" parses as UTC midnight and
  // can render as the previous day in a west-of-UTC tz. Nairobi is UTC+3 so it
  // would not bite here, but a date that is wrong anywhere is wrong.
  const dt=new Date(+y,+mo-1,+d), today=new Date();
  const midnight=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
  const days=Math.round((midnight(dt)-midnight(today))/86400000);
  let label;
  if(days===0) label="Today";
  else if(days===1) label="Tomorrow";
  else if(days===-1) label="Yesterday";
  else label=`${DAYS[dt.getDay()]} ${+d} ${MONS[+mo-1]}`;
  const w=win&&/morning|afternoon|evening/i.test(win)?win.toLowerCase():"";
  return w?`${label} · ${w}`:label;
}

/* Per-item flags, gathered for the card. "pet hair" on one sofa changes what
   she packs in the van, so it has to survive to the glance-level view rather
   than living three taps deep inside the edit form. */
const FLAG_LABEL={urgent:"urgent",fragile:"fragile",pet_hair:"pet hair",extra_dirty:"extra dirty"};
function jobFlags(job){
  try{
    const b=JSON.parse(job.items||"{}"),seen=new Set();
    (b.items||[]).forEach(i=>(i.flags||[]).forEach(f=>seen.add(f)));
    return [...seen];
  }catch{ return []; }
}
function itemNotes(job){
  try{
    const b=JSON.parse(job.items||"{}");
    return (b.items||[]).filter(i=>(i.note||"").trim()).map(i=>{
      const n=(S.cat?.services||[]).find(s=>s.key===i.service);
      return {label:n?n.label:i.service, note:i.note};
    });
  }catch{ return []; }
}

/* Human-readable service line. Mercy must never see the raw basket. */
function serviceLine(job){
  if(job.items && !job.items.trim().startsWith("{")) return job.items;
  try{
    const b=JSON.parse(job.items||"{}");
    const bits=[];
    (b.items||[]).map(i=>{
      const n=(S.cat?.services||[]).find(s=>s.key===i.service);
      const nm=n?n.label:i.service;
      let s;
      if(i.tier){
        const tr=(n?.tiers||[]).find(x=>x.key===i.tier);
        s=`${nm} ${tr?tr.label:i.tier}`;
        // Extra bedrooms are real work and real money; leaving them off the card
        // sends Mercy to a bigger house than the line describes.
        if(i.extra_bedrooms) s+=` +${i.extra_bedrooms} bedroom${i.extra_bedrooms>1?"s":""}`;
      } else if(i.size){
        const tier=(n?.tiers||[]).find(x=>x.key===i.size);
        s=`${nm} ${tier?tier.label:i.size}`;
        // ×4 sheers is four panels, not one. The count was being dropped.
        if((i.qty||1)>1) s+=` ×${i.qty}`;
      } else if(i.seats>1){
        s=`${nm} — ${i.seats} seats`;
      } else {
        s=nm;
      }
      bits.push(s);
      // Per-item extras (dining / office chairs) were missing entirely -- a
      // KSh 1,000 chunk of a real quote that never reached the card.
      (i.extras||[]).forEach(x=>{
        const meta=(n?.extras||[]).find(e=>e.key===x.key);
        bits.push(`+ ${meta?meta.label:x.key}${(x.qty||1)>1?` ×${x.qty}`:""}`);
      });
      (i.modifiers||[]).forEach(mk=>{
        const meta=(n?.modifiers||[]).find(m=>m.key===mk);
        bits.push(`+ ${meta?meta.label:mk}`);
      });
    });
    (b.addons||[]).forEach(a=>{
      const meta=(S.cat?.addons||[]).find(x=>x.key===a.key);
      bits.push(`+ ${meta?meta.label:a.key}${(a.qty||1)>1?` ×${a.qty}`:""}`);
    });
    // Work the price list has no entry for is still work Mercy has to do.
    ((b.operator||{}).custom_lines||[]).forEach(c=>bits.push(`+ ${c.label}`));
    return bits.join(" · ")||"—";
  }catch{ return job.items||"—"; }
}

function askPin(again){
  document.getElementById("sheetBody").innerHTML=`
    <h2>Myrah jobs</h2>
    <div class="when">${again?"That PIN was not accepted.":"Kept for this session only."}</div>
    <label for="pin">PIN</label>
    <input id="pin" type="password" autocomplete="off" autocapitalize="none" spellcheck="false">
    <button class="act primary" id="go">Open</button>`;
  const s=document.getElementById("sheet"); s.showModal();
  const go=()=>{S.pin=document.getElementById("pin").value.trim();
    sessionStorage.setItem("myrah_pin",S.pin);s.close();load();};
  document.getElementById("go").onclick=go;
  document.getElementById("pin").onkeydown=e=>{if(e.key==="Enter")go();};
}

async function load(){
  if(!S.pin) return askPin(false);
  try{
    S.board=await (await api("/board")).json();
    if(!S.cat) S.cat=await (await api("/catalogue")).json();
  }catch(e){ if(e.message!=="pin") document.getElementById("sub").textContent=e.message; return; }
  const b=S.board,tot=COLS.reduce((n,c)=>n+b.columns[c].length,0);
  const owed=b.columns.unpaid.reduce((n,j)=>n+j.balance_cents,0);
  document.getElementById("sub").textContent=
    `${tot} job${tot===1?"":"s"} · ${b.deposit_pct}% deposit`+(owed?` · ${money(owed)} owing`:"");
  document.getElementById("tabs").innerHTML=COLS.map(c=>
    `<button class="tab" role="tab" aria-selected="${c===S.col}" data-c="${c}">${LABEL[c]}<span class="n">${b.columns[c].length}</span></button>`).join("");
  document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{S.col=t.dataset.c;render();});
  render();
}

function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected",t.dataset.c===S.col));
  const jobs=S.board.columns[S.col],el=document.getElementById("list");
  if(!jobs.length){el.innerHTML=`<div class="empty">Nothing in ${LABEL[S.col]} right now.</div>`;return;}
  el.innerHTML=jobs.map(j=>{
    const need=j.deposit_required_cents-j.deposit_paid_cents;
    const pills=[];
    if(j.visit_first) pills.push(`<span class="pill need">visit first — price after seeing it</span>`);
    else if(need>0)   pills.push(`<span class="pill need">${money(need)} deposit to book</span>`);
    else if(j.deposit_paid_cents>0) pills.push(`<span class="pill ok">deposit paid</span>`);
    if(j.balance_cents>0&&j.paid_cents>0) pills.push(`<span class="pill owe">${money(j.balance_cents)} owing</span>`);
    if(j.notes) pills.push(`<span class="pill note">has instructions</span>`);
    jobFlags(j).forEach(f=>pills.push(`<span class="pill flag">${FLAG_LABEL[f]||f}</span>`));
    const area=j.area?j.area[0].toUpperCase()+j.area.slice(1):"—";
    return `<div class="card" data-ref="${j.ref}">
      <div class="top">
        <div class="idn"><span class="who">${j.client_name}</span></div>
        <div class="rt"><span class="amt">${money(j.total_cents)}</span>${I_CHEV}</div>
      </div>
      <div class="svc">${serviceLine(j)}</div>
      <div class="meta">
        <span class="mi">${I_PIN}${area}</span>
        <span class="mi">${I_CAL}${whenLine(j.scheduled_at||j.preferred)}</span>
        <span class="ref">${j.ref}</span>
      </div>
      ${pills.length?`<div class="pills">${pills.join("")}</div>`:""}
    </div>`;}).join("");
  el.querySelectorAll(".card").forEach(c=>c.onclick=()=>openJob(c.dataset.ref));
}

async function openJob(ref){
  const j=await (await api("/jobs/"+ref)).json();
  const log=await (await api(`/jobs/${ref}/changes`)).json();
  const need=j.deposit_required_cents-j.deposit_paid_cents;
  let acts="";
  if(j.status==="quoted")    acts = need>0
      ? `<button class="act primary" id="pay">Record ${money(need)} deposit</button>`
      : `<button class="act primary" id="book">Book it</button>`;
  else if(j.status==="booked")    acts=`<button class="act primary" id="done">Mark completed</button>`;
  else if(j.status==="completed") acts=`<button class="act primary" id="pay">Record payment · ${money(j.balance_cents)} owing</button>`;
  else if(j.status==="paid")      acts=`<button class="act ghost" id="rcpt">Receipt</button>`;

  document.getElementById("sheetBody").innerHTML=`
    <h2>${j.client_name}</h2>
    <div class="when">${j.ref} · ${j.status} · ${j.area||"—"}</div>
    <div class="svc" style="margin-top:10px">${serviceLine(j)}</div>
    <div class="totals">
      <div><span>Total</span><span class="big">${money(j.total_cents)}</span></div>
      <div><span>Paid</span><span>${money(j.paid_cents)}</span></div>
      ${j.balance_cents?`<div><span>Owing</span><span>${money(j.balance_cents)}</span></div>`:""}
    </div>
    ${j.notes?`<div class="log"><b>Instructions:</b> ${j.notes}</div>`:""}
    ${itemNotes(j).map(n=>`<div class="log"><b>${n.label}:</b> ${n.note}</div>`).join("")}
    ${log.changes.length?`<div class="log">${log.changes.map(c=>
      `<div>${c.kind==="reprice"?`${money(c.old_total_cents)} → ${money(c.new_total_cents)}`:"instructions"} · ${c.detail} · ${c.at.slice(0,16).replace("T"," ")}</div>`).join("")}</div>`:""}
    <div id="slot"></div>
    ${acts}
    <button class="act ghost" id="edit">Change scope or add instructions</button>
    <button class="act ghost" id="close">Close</button>`;
  const s=document.getElementById("sheet"); if(!s.open) s.showModal();
  const B=id=>document.getElementById(id);
  B("close").onclick=()=>{s.close();load();};
  B("edit").onclick=()=>editForm(j);
  if(B("book")) B("book").onclick=()=>bookForm(j);
  if(B("pay"))  B("pay").onclick =()=>payForm(j);
  if(B("done")) B("done").onclick=async()=>{await api(`/jobs/${j.ref}/complete`,{method:"POST"});openJob(j.ref);};
  if(B("rcpt")) B("rcpt").onclick=async()=>{
    const r=await (await api(`/jobs/${j.ref}/receipt`)).json();
    B("slot").innerHTML=`<div class="msg good">${r.business.name}<br>${r.receipt_ref} · paid ${money(r.paid_cents)}<br>eTIMS: ${r.business.etims}</div>`;};
}

/* ── The composer — a LINE-BASED model, mirroring the customer calculator ────
   Written by reading apps/web/src/screens/Configure.tsx and reproducing every
   degree of freedom it gives, control for control.

   THE BUG THIS REPLACES: the previous version was a reduced reimplementation --
   one checkbox per service, qty pinned to 1, and no extras, house tiers, extra
   bedrooms, modifiers or add-ons at all. Mercy could not quote two sofas, or
   sheers AND heavy curtains, or a 3-bedroom house, though any customer can do
   all three unaided. The operator surface must be a strict SUPERSET of the
   customer's, never a subset.

   Every control is driven by CATALOGUE METADATA, never a hardcoded list, so a
   new tier or modifier reaches both surfaces at once. test_operator_parity.py
   fails if this surface is ever narrower than the catalogue allows.          */

let LINES = [], ADDONS = {};
let _uid = 0;
const uid = () => `l${++_uid}`;

const svcOf = k => (S.cat.services || []).find(s => s.key === k);
// A house is one house. Sofas, carpets, curtains and mattresses come in
// assorted sizes, so those repeat -- the same rule as Configure.tsx.
const repeatable = sv => sv.strategy === "size_tier" || sv.strategy === "per_unit";
const shillings = n => "KSh " + Number(n || 0).toLocaleString("en-KE");

function addLine(k) {
  LINES.push({ uid: uid(), service: k, qty: 1, extras: [], modifiers: [], extra_bedrooms: 0 });
}
function toggleService(k) {
  if (LINES.some(l => l.service === k)) LINES = LINES.filter(l => l.service !== k);
  else addLine(k);
}
function resetComposer() { LINES = []; ADDONS = {}; }

function linesFromJob(j) {
  resetComposer();
  try {
    const b = JSON.parse(j.items || "{}");
    (b.items || []).forEach(i => LINES.push({
      uid: uid(), service: i.service, tier: i.tier, size: i.size, seats: i.seats,
      qty: i.qty ?? 1, extra_bedrooms: i.extra_bedrooms || 0,
      modifiers: i.modifiers || [], extras: i.extras || [],
      note: i.note || "", flags: i.flags || [], tags: i.tags || [],
    }));
    (b.addons || []).forEach(a => { ADDONS[a.key] = a.qty ?? 1; });
  } catch {}
}

function counterRow(label, u, field, val) {
  return `<div class="row"><span>${label}</span><span class="ctr">
    <button type="button" data-step="${u}|${field}|-1" aria-label="less">–</button>
    <b>${val}</b>
    <button type="button" data-step="${u}|${field}|1" aria-label="more">+</button></span></div>`;
}

function lineHTML(l, sv, i, n) {
  let body = "";
  if (sv.strategy === "per_unit") {
    body = counterRow(`How many ${sv.unit || "unit"}s?`, l.uid, "seats", l.seats ?? sv.min_units ?? 1);
    // Dining and office chairs -- a real freedom the customer has and the
    // operator did not.
    (sv.extras || []).forEach(x => {
      const q = (l.extras || []).find(e => e.key === x.key)?.qty || 0;
      body += counterRow(`${x.label} · ${shillings(x.price)} each`, l.uid, `extra:${x.key}`, q);
    });
  } else if (sv.strategy === "tier") {
    body = `<div class="chips">${(sv.tiers || []).map(t =>
      `<button type="button" class="tchip ${l.tier === t.key ? "on" : ""}" data-set="${l.uid}|tier|${t.key}">${t.label} · ${shillings(t.price)}</button>`).join("")}</div>`;
    const last = (sv.tiers || []).at(-1);
    if (sv.extra && last && l.tier === last.key)
      body += counterRow(`${sv.extra.label} · ${shillings(sv.extra.price)} each`, l.uid, "extra_bedrooms", l.extra_bedrooms || 0);
  } else if (sv.strategy === "size_tier") {
    const chips = (sv.tiers || []).map(t =>
      `<button type="button" class="tchip ${l.size === t.key ? "on" : ""}" data-set="${l.uid}|size|${t.key}">${t.label}${sv.tier_unit ? " " + sv.tier_unit : ""} · ${shillings(t.price)}</button>`);
    if (sv.above) chips.push(`<button type="button" class="tchip ${l.size === sv.above.key ? "on" : ""}" data-set="${l.uid}|size|${sv.above.key}">${sv.above.label} · from ${shillings(sv.above.price)}</button>`);
    if (sv.larger === "visit") chips.push(`<button type="button" class="tchip ${l.size === "larger" ? "on" : ""}" data-set="${l.uid}|size|larger">Larger</button>`);
    body = `<div class="chips">${chips.join("")}</div>`;
    if (l.size === "larger" || (sv.above && l.size === sv.above.key))
      body += `<div class="vbadge">priced after a visit</div>`;
    (sv.modifiers || []).forEach(m => {
      const on = (l.modifiers || []).includes(m.key);
      body += `<div class="chips"><button type="button" class="tchip ${on ? "on" : ""}" data-mod="${l.uid}|${m.key}">${m.label}${m.add_range ? ` +${m.add_range[0]}–${m.add_range[1]}` : ""}</button></div>`;
      if (on) body += `<div class="vbadge">priced after a visit</div>`;
    });
    body += counterRow("How many?", l.uid, "qty", l.qty ?? 1);
  } else {
    body = `<div class="when">quoted after a visit</div>`;
  }
  const hdr = n > 1
    ? `<div class="lineh"><span>${sv.label} ${i + 1}</span><button type="button" class="rm" data-rm="${l.uid}">Remove</button></div>`
    : "";
  return `<div class="line">${hdr}${body}${detailHTML(l)}</div>`;
}

/* Operator-only per-item detail. A customer has no use for "extra dirty" or
   "handle the silk gently"; Mercy needs it on the day, per item, not buried in
   one job-level note. Collapsed by default -- most lines never need it, and an
   always-open panel per line would bury the price controls. */
const FLAGS = [
  { key: "urgent",      label: "urgent" },
  { key: "fragile",     label: "fragile" },
  { key: "pet_hair",    label: "pet hair" },
  { key: "extra_dirty", label: "extra dirty" },
];

function detailHTML(l) {
  const n = (l.flags || []).length + ((l.note || "").trim() ? 1 : 0) + (l.tags || []).length;
  if (!l._open) {
    return `<button type="button" class="detbtn" data-det="${l.uid}">
      + detail${n ? ` · ${n}` : ""}</button>`;
  }
  return `<div class="det">
    <div class="chips">${FLAGS.map(f =>
      `<button type="button" class="tchip ${(l.flags || []).includes(f.key) ? "on" : ""}" data-flag="${l.uid}|${f.key}">${f.label}</button>`).join("")}</div>
    <textarea data-note="${l.uid}" placeholder="Special instructions for this item…">${l.note || ""}</textarea>
    <input data-tags="${l.uid}" placeholder="tags, comma separated" value="${(l.tags || []).join(", ")}">
    <button type="button" class="detbtn" data-det="${l.uid}">– hide detail</button>
  </div>`;
}

function addonsHTML() {
  if (!LINES.length) return "";
  return `<div class="grp"><div class="grph">Anything else?</div>
    ${(S.cat.addons || []).map(a => {
      const q = ADDONS[a.key] || 0;
      const price = a.price_range ? `${shillings(a.price_range[0])}–${shillings(a.price_range[1])}`
                  : a.from ? `from ${shillings(a.price || 0)}` : shillings(a.price || 0);
      return a.per === "unit"
        ? counterRow(`${a.label} · ${price} each`, `addon:${a.key}`, "addon", q)
        : `<div class="row"><span>${a.label} · ${price}</span><button type="button" class="tchip ${q ? "on" : ""}" data-atog="${a.key}">${q ? "Added" : "Add"}</button></div>`;
    }).join("")}</div>`;
}

/* Prices — the operator-only deviation surface (§3b).

   Shows each line the ENGINE produced with its own price, and lets Mercy adjust
   THAT, rather than typing a total over a number she cannot see. Every change
   here names itself in the job's change log.

   The label is captured alongside the index and sent back with the override:
   if the basket moved underneath it, the server refuses the whole re-price
   rather than repricing a line nobody chose. */
let PRICED = null, OVERRIDES = {}, CUSTOM = [], TRANSPORT = null;

function pricesHTML() {
  if (!PRICED) return "";
  const rows = PRICED.lines.map((l, i) => {
    const ov = OVERRIDES[i];
    const changed = ov != null && ov !== l.amount;
    return `<div class="prow">
      <span class="plab">${l.label}</span>
      <span class="pauto ${changed ? "struck" : ""}">${shillings(l.amount)}</span>
      <input class="povr" inputmode="numeric" data-ovr="${i}"
             value="${ov != null ? ov : ""}" placeholder="${l.amount}">
    </div>`;
  }).join("");
  // Travel is not an engine LINE (it rides beside the subtotal, like the
  // call-out floor), so it needs its own control rather than a line index.
  const zone = PRICED.transport_zone_fee || 0;
  const shown = TRANSPORT === null ? (PRICED.transport || 0) : TRANSPORT;
  const transportRow = `<div class="prow">
      <span class="plab">Transport${PRICED.area ? " · " + PRICED.area : ""}</span>
      <span class="pauto ${shown !== zone ? "struck" : ""}">${shillings(zone)}</span>
      <input class="povr" inputmode="numeric" data-tovr value="${TRANSPORT === null ? "" : TRANSPORT}" placeholder="${zone}">
    </div>`;
  const customRows = CUSTOM.map((c, i) => `<div class="prow">
      <input class="plab" data-clab="${i}" value="${c.label}" placeholder="What is it?">
      <input class="povr" inputmode="numeric" data-camt="${i}" value="${c.amount || ""}" placeholder="0">
      <button type="button" class="rm" data-crm="${i}">Remove</button>
    </div>`).join("");
  return `<div class="grp"><div class="grph">Prices</div>
    <div class="when">Auto price on the left. Type a different figure only if the job is not what the price list assumes.</div>
    ${rows}
    ${transportRow}
    ${customRows}
    <button type="button" class="act ghost sm" id="addcustom">+ Add something not on the price list</button>
  </div>`;
}

function wirePrices(host, rerender) {
  const q = s => host.querySelectorAll(s);
  q("[data-ovr]").forEach(el => el.onblur = () => {
    const i = Number(el.dataset.ovr), v = el.value.trim();
    if (v === "") delete OVERRIDES[i]; else OVERRIDES[i] = Math.max(0, Number(v) || 0);
    rerender();
  });
  q("[data-tovr]").forEach(el => el.onblur = () => {
    const v = el.value.trim();
    TRANSPORT = v === "" ? null : Math.max(0, Number(v) || 0);
    rerender();
  });
  q("[data-clab]").forEach(el => el.onblur = () => { CUSTOM[Number(el.dataset.clab)].label = el.value; });
  q("[data-camt]").forEach(el => el.onblur = () => {
    CUSTOM[Number(el.dataset.camt)].amount = Math.max(0, Number(el.value) || 0);
  });
  q("[data-crm]").forEach(b => b.onclick = () => { CUSTOM.splice(Number(b.dataset.crm), 1); rerender(); });
  const add = host.querySelector("#addcustom");
  if (add) add.onclick = () => { CUSTOM.push({ label: "", amount: 0 }); rerender(); };
}

function readOperator() {
  return {
    // null means "use the zone fee" -- only send an override if she typed one.
    transport_override: TRANSPORT,
    overrides: Object.entries(OVERRIDES)
      .filter(([i, v]) => PRICED && PRICED.lines[i] && v !== PRICED.lines[i].amount)
      .map(([i, v]) => ({ index: Number(i), label: PRICED.lines[i].label, amount: v,
                          reason: document.getElementById("rs")?.value || "" })),
    custom_lines: CUSTOM.filter(c => c.label.trim()).map(c => ({
      label: c.label.trim(), amount: c.amount || 0 })),
  };
}

function composerHTML() {
  const picked = new Set(LINES.map(l => l.service));
  const pick = (S.cat.services || []).map(sv => {
    const on = picked.has(sv.key);
    const price = sv.strategy === "visit" ? "after a visit"
                : sv.from_label ? "from " + shillings(sv.from_label) : "";
    return `<label class="pickchip ${on ? "on" : ""}">
       <input type="checkbox" data-svc="${sv.key}" ${on ? "checked" : ""}>
       <span class="pkbody">
         ${sv.icon ? `<span class="pkico" aria-hidden="true">${sv.icon}</span>` : ""}
         <span class="pktxt">
           <span class="nm">${sv.label}</span>
           ${price ? `<span class="ph">${price}</span>` : ""}
         </span>
       </span>
       <span class="pkbox" aria-hidden="true">
         <span class="pkmark">${I_TICK}</span>
         <span class="pklab">${on ? "Added" : "Add"}</span>
       </span>
     </label>`;
  }).join("");

  const order = [], by = new Map();
  LINES.forEach(l => {
    if (!by.has(l.service)) { by.set(l.service, []); order.push(l.service); }
    by.get(l.service).push(l);
  });
  const groups = order.map(k => {
    const sv = svcOf(k); if (!sv) return "";
    const rows = by.get(k);
    return `<div class="grp"><div class="grph">${sv.icon || ""} ${sv.label}</div>
      ${rows.map((l, i) => lineHTML(l, sv, i, rows.length)).join("")}
      ${repeatable(sv) ? `<button type="button" class="act ghost sm" data-add="${k}">+ Add another</button>` : ""}</div>`;
  }).join("");

  return `<div class="pickgrid">${pick}</div>${groups}${addonsHTML()}`;
}

function wireComposer(host, rerender) {
  const q = s => host.querySelectorAll(s);
  q("[data-svc]").forEach(cb => cb.onchange = () => { toggleService(cb.dataset.svc); rerender(); });
  q("[data-add]").forEach(b => b.onclick = () => { addLine(b.dataset.add); rerender(); });
  q("[data-rm]").forEach(b => b.onclick = () => { LINES = LINES.filter(l => l.uid !== b.dataset.rm); rerender(); });
  q("[data-set]").forEach(b => b.onclick = () => {
    const [u, f, v] = b.dataset.set.split("|");
    const l = LINES.find(x => x.uid === u); if (l) { l[f] = v; rerender(); }
  });
  q("[data-mod]").forEach(b => b.onclick = () => {
    const [u, k] = b.dataset.mod.split("|");
    const l = LINES.find(x => x.uid === u); if (!l) return;
    const on = (l.modifiers || []).includes(k);
    l.modifiers = on ? l.modifiers.filter(m => m !== k) : [...(l.modifiers || []), k];
    rerender();
  });
  q("[data-det]").forEach(b => b.onclick = () => {
    const l = LINES.find(x => x.uid === b.dataset.det); if (l) { l._open = !l._open; rerender(); }
  });
  q("[data-flag]").forEach(b => b.onclick = () => {
    const [u, k] = b.dataset.flag.split("|");
    const l = LINES.find(x => x.uid === u); if (!l) return;
    const on = (l.flags || []).includes(k);
    l.flags = on ? l.flags.filter(f => f !== k) : [...(l.flags || []), k];
    rerender();
  });
  // Typed text is read on BLUR, not on every keystroke: re-rendering mid-word
  // would move the caret and lose focus on a phone keyboard.
  q("[data-note]").forEach(el => el.onblur = () => {
    const l = LINES.find(x => x.uid === el.dataset.note); if (l) l.note = el.value;
  });
  q("[data-tags]").forEach(el => el.onblur = () => {
    const l = LINES.find(x => x.uid === el.dataset.tags);
    if (l) l.tags = el.value.split(",").map(s => s.trim()).filter(Boolean);
  });
  q("[data-atog]").forEach(b => b.onclick = () => {
    const k = b.dataset.atog;
    if (ADDONS[k]) delete ADDONS[k]; else ADDONS[k] = 1;
    rerender();
  });
  q("[data-step]").forEach(b => b.onclick = () => {
    const [u, f, d] = b.dataset.step.split("|"), step = Number(d);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
    if (u.startsWith("addon:")) {
      const k = u.slice(6);
      const next = clamp((ADDONS[k] || 0) + step, 0, 50);
      if (next) ADDONS[k] = next; else delete ADDONS[k];
      return rerender();
    }
    const l = LINES.find(x => x.uid === u); if (!l) return;
    const sv = svcOf(l.service);
    if (f.startsWith("extra:")) {
      const key = f.slice(6);
      const cur = (l.extras || []).find(e => e.key === key)?.qty || 0;
      const next = clamp(cur + step, 0, 50);
      l.extras = (l.extras || []).filter(e => e.key !== key);
      if (next > 0) l.extras.push({ key, qty: next });
    } else if (f === "seats") {
      l.seats = clamp((l.seats ?? sv.min_units ?? 1) + step, sv.min_units ?? 1, sv.max_units ?? 20);
    } else if (f === "qty") {
      l.qty = clamp((l.qty ?? 1) + step, 1, 50);
    } else if (f === "extra_bedrooms") {
      l.extra_bedrooms = clamp((l.extra_bedrooms || 0) + step, 0, 10);
    }
    rerender();
  });
}

/* Send only what each strategy actually uses, so the engine never receives a
   field it will reject -- the original bug in reverse. */
function readLines() {
  return LINES.map(l => {
    const sv = svcOf(l.service), o = { service: l.service };
    if (!sv) return o;
    if (sv.strategy === "per_unit") {
      o.seats = l.seats ?? sv.min_units ?? 1;
      if ((l.extras || []).length) o.extras = l.extras;
    } else if (sv.strategy === "tier") {
      if (l.tier) o.tier = l.tier;
      if (l.extra_bedrooms) o.extra_bedrooms = l.extra_bedrooms;
    } else if (sv.strategy === "size_tier") {
      if (l.size) o.size = l.size;
      o.qty = l.qty ?? 1;
      if ((l.modifiers || []).length) o.modifiers = l.modifiers;
    }
    // Operator detail rides alongside; the engine ignores these keys and the
    // repository stores the raw dict, so they survive without a schema change.
    if ((l.note || "").trim()) o.note = l.note.trim();
    if ((l.flags || []).length) o.flags = l.flags;
    if ((l.tags || []).length) o.tags = l.tags;
    return o;
  });
}
function readAddons() {
  return Object.entries(ADDONS).filter(([, q]) => q > 0).map(([key, qty]) => ({ key, qty }));
}

/* What Mercy charges to travel to each area (MYRAH_OPERATIONS_DESIGN §3d).

   These are HERS. They ship at 0, which behaves exactly like the old
   "transport confirmed on WhatsApp" world, so the mechanism could ship before
   she had set a single number and nothing quietly started charging her clients
   a figure nobody chose. */
async function transportForm(){
  const d=await (await api("/transport")).json();
  document.getElementById("sheetBody").innerHTML=`
    <h2>Transport by area</h2>
    <div class="when">Added to every quote for that area, and the deposit is
      worked out on the total including it — so a deposit covers your trip out.</div>
    ${d.zones.map(z=>`<div class="prow">
        <span class="plab">${z.label||z.area_key}${z.confirm?' <span class="when">· confirm cover</span>':''}</span>
        <input class="povr" inputmode="numeric" data-fee="${z.area_key}" value="${z.fee||""}" placeholder="0">
      </div>`).join("")}
    <div class="msg" id="mz"></div>
    <div class="when">Leave one at 0 and that area still quotes normally —
      transport just stays "confirmed on WhatsApp" for it.</div>
    <button class="act ghost" id="close">Close</button>`;
  const s=document.getElementById("sheet"); if(!s.open) s.showModal();
  const m=document.getElementById("mz");
  document.querySelectorAll("[data-fee]").forEach(el=>el.onblur=async()=>{
    const key=el.dataset.fee, fee=Math.max(0,Number(el.value)||0);
    m.className="msg";m.textContent="Saving…";
    const r=await api(`/transport/${key}`,{method:"PUT",body:JSON.stringify({fee})});
    if(r.ok){m.className="msg good";m.textContent=`${key} transport saved.`;}
    else {m.className="msg err";m.textContent=await reason(r);}
  });
  document.getElementById("close").onclick=()=>{s.close();load();};
}

async function quoteForm(){
  if(!S.cat) S.cat=await (await api("/catalogue")).json();
  document.getElementById("sheetBody").innerHTML=`
    <h2>New quote</h2><div class="when">Same prices the customer sees.</div>
    <label for="nm">Customer</label><input id="nm" placeholder="Name from the chat">
    <label for="ar">Area</label><select id="ar">${S.cat.areas.map(a=>`<option value="${a.key}">${a.label}</option>`).join("")}</select>
    <label>What needs cleaning?</label><div id="comp"></div>
    <button class="act primary" id="go">Price it</button><div class="msg" id="m"></div>
    <button class="act ghost" id="close">Cancel</button>`;
  const s=document.getElementById("sheet"); if(!s.open) s.showModal();
  resetComposer();
  const host=document.getElementById("comp");
  const draw=()=>{host.innerHTML=composerHTML();wireComposer(host,draw);};
  draw();
  document.getElementById("close").onclick=()=>{s.close();load();};
  document.getElementById("go").onclick=async()=>{
    const m=document.getElementById("m"),items=readLines();
    if(!items.length){m.className="msg err";m.textContent="Pick at least one service.";return;}
    const r=await api("/quotes",{method:"POST",body:JSON.stringify({items,addons:readAddons(),
      area:document.getElementById("ar").value,
      preferred:{day:new Date().toISOString().slice(0,10),window:"morning"},
      contact:{name:document.getElementById("nm").value||"Walk-in"},recurring:false})});
    if(!r.ok){m.className="msg err";m.textContent=await reason(r);return;}
    const d=await r.json();
    m.className="msg good";
    m.innerHTML=`${d.quote_ref} · <b>${money(d.job.total_cents)}</b><br><a href="${d.whatsapp_url}" target="_blank" rel="noopener">Send it on WhatsApp →</a>`;
    setTimeout(()=>{s.close();load();},2800);
  };
}

/* §3b — change scope after a site visit or on the morning. */
async function editForm(j){
  if(!S.cat) S.cat=await (await api("/catalogue")).json();
  linesFromJob(j);
  document.getElementById("sheetBody").innerHTML=`
    <h2>Change this job</h2>
    <div class="when">${j.ref} · re-prices with the same engine</div>
    <label>Instructions for the day</label>
    <textarea id="nt" placeholder="Gate code, dog, start upstairs…">${j.notes||""}</textarea>
    <button class="act ghost" id="saveNotes">Save instructions</button><div class="msg" id="mn"></div>
    <label>Scope</label><div id="comp"></div><div id="prices"></div>
    <label for="rs">What changed?</label><input id="rs" placeholder="e.g. after site visit">
    <button class="act navy" id="go">Re-price</button><div class="msg" id="m"></div>
    <button class="act ghost" id="back">Back</button>`;
  const host=document.getElementById("comp"), phost=document.getElementById("prices");
  const draw=()=>{
    host.innerHTML=composerHTML();wireComposer(host,draw);
    phost.innerHTML=pricesHTML();wirePrices(phost,draw);
  };
  draw();
  // Line-by-line prices come from the engine, on demand, for this one job.
  PRICED=null;OVERRIDES={};CUSTOM=[];TRANSPORT=null;
  api(`/jobs/${j.ref}/lines`).then(r=>r.json()).then(d=>{
    PRICED=d;
    (d.operator?.custom_lines||[]).forEach(c=>CUSTOM.push({label:c.label,amount:c.amount}));
    (d.operator?.overrides||[]).forEach(o=>{OVERRIDES[o.index]=o.amount;});
    if(d.operator?.transport_override!=null) TRANSPORT=d.operator.transport_override;
    draw();
  }).catch(()=>{});
  const B=id=>document.getElementById(id);
  B("back").onclick=()=>openJob(j.ref);
  B("saveNotes").onclick=async()=>{
    const m=B("mn");
    m.className="msg";m.textContent="Saving…";
    const r=await api(`/jobs/${j.ref}/notes`,{method:"POST",body:JSON.stringify({notes:B("nt").value})});
    if(r.ok){m.className="msg good";m.textContent="Instructions saved.";}
    else {m.className="msg err";m.textContent=await reason(r);}
  };
  B("go").onclick=async()=>{
    const m=B("m"),items=readLines();
    if(!items.length){m.className="msg err";m.textContent="A job needs at least one service.";return;}
    const r=await api(`/jobs/${j.ref}/reprice`,{method:"POST",
      body:JSON.stringify({items,addons:readAddons(),reason:B("rs").value||"scope changed",
        operator:readOperator()})});
    if(!r.ok){m.className="msg err";m.textContent=await reason(r);return;}
    const d=await r.json();
    m.className="msg good";
    m.innerHTML=`${money(d.old_total_cents)} → <b>${money(d.new_total_cents)}</b>`+
      (d.deposit_already_paid_cents?`<br>Deposit already paid (${money(d.deposit_already_paid_cents)}) stands.`:"");
    setTimeout(()=>openJob(j.ref),2200);
  };
}

function bookForm(j){
  document.getElementById("slot").innerHTML=`
    <label for="d">Day</label><input id="d" type="date" value="${new Date().toISOString().slice(0,10)}">
    <label for="w">Window</label><select id="w"><option value="morning">Morning</option><option value="afternoon">Afternoon</option></select>
    <button class="act navy" id="go">Confirm booking</button><div class="msg" id="m"></div>`;
  document.getElementById("go").onclick=async()=>{
    const r=await api(`/jobs/${j.ref}/book`,{method:"POST",body:JSON.stringify({
      scheduled_at:document.getElementById("d").value,window:document.getElementById("w").value})});
    const d=await r.json(),m=document.getElementById("m");
    if(d.ok){m.className="msg good";m.textContent="Booked.";setTimeout(()=>openJob(j.ref),800);}
    else{m.className="msg err";m.textContent=d.reason;}
  };
}
function payForm(j){
  const need=j.deposit_required_cents-j.deposit_paid_cents;
  const kind=j.status==="quoted"?"deposit":"balance";
  const pre=kind==="deposit"?need:j.balance_cents;
  document.getElementById("slot").innerHTML=`
    <label for="a">Amount (KSh)</label><input id="a" type="number" inputmode="numeric" value="${Math.round(pre/100)}">
    <label for="r">M-Pesa code (optional)</label><input id="r" autocomplete="off" autocapitalize="characters" placeholder="TFE5G7H8L3">
    <button class="act navy" id="go">Record ${kind}</button><div class="msg" id="m"></div>`;
  document.getElementById("go").onclick=async()=>{
    const r=await api(`/jobs/${j.ref}/payments`,{method:"POST",body:JSON.stringify({
      amount_cents:Math.round(Number(document.getElementById("a").value)*100),kind,
      mpesa_ref:document.getElementById("r").value.trim()||null})});
    const d=await r.json(),m=document.getElementById("m");
    if(d.ok){m.className="msg good";m.textContent="Recorded.";setTimeout(()=>openJob(j.ref),800);}
    else{m.className="msg err";m.textContent=d.reason;}
  };
}

document.getElementById("newq").onclick=quoteForm;
document.getElementById("zones").onclick=transportForm;
load();
</script>
