server {
  listen 3000;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  # The app targets mid-range Android over mobile data (QUOTE_CALCULATOR_SPEC §12).
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/css text/plain application/javascript application/json image/svg+xml;

  # Docker's embedded DNS. Without a *variable* upstream nginx resolves `api` once
  # at startup and 502s permanently after the api container restarts with a new IP.
  resolver 127.0.0.11 valid=30s ipv6=off;
  set $api_upstream http://api:8010;

  location /api/ {
    # No trailing slash and no URI path on proxy_pass, so the /api prefix is
    # preserved for FastAPI's APIRouter(prefix="/api") mount.
    proxy_pass $api_upstream;
    proxy_http_version 1.1;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Cloudflare puts the true client IP here. Without it every request looks like
    # this container and the per-IP quote rate limit would throttle all of Nairobi.
    proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

    proxy_connect_timeout 5s;
    proxy_read_timeout   30s;
  }

  # Vite emits content-hashed filenames, so these are safe to pin forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA fallback so a deep link or a hard refresh still boots the app.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
