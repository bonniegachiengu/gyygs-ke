[project]
name = "myra-api"
version = "0.1.0"
description = "Myra quote calculator API — pricing engine and quote contract"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.13.0",
    "pydantic-settings>=2.15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]
# Google Sheets lead store (M2). Kept out of the default install so M0/M1 need
# no Google dependency at all — repositories/sheets.py is imported lazily.
sheets = [
    "gspread>=6.2.0",
    "google-auth>=2.38.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
