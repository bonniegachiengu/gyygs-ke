# Cloudflare named tunnel serving every product on this host.
#
# The UUID is an identifier, not a secret, so this file is committed. The
# credentials it points at (<uuid>.json) are gitignored and copied in by hand —
# see the tunnel section of README.md.
#
# Created with:
#   cloudflared tunnel create myra
#   cloudflared --config /dev/null tunnel route dns myra myra.vyybandasky.online
#
# The `--config /dev/null` matters: without it the CLI picks up the tunnel named
# in ~/.cloudflared/config.yml (vyyb-os on this machine) and points the CNAME at
# the wrong tunnel, silently.

tunnel: ff3356b1-319e-4f65-a451-08b0cdfc212b
credentials-file: /etc/cloudflared/ff3356b1-319e-4f65-a451-08b0cdfc212b.json
loglevel: info

# Convention (DOMAINS.md): one short canonical subdomain per product, each with
# an optional long-name alias pointing at the SAME service. The short name is
# what goes in copy, QR codes and links.
#
# Every rule must sit above the catch-all — cloudflared matches in order.
ingress:
  # ── Myra — quote calculator (nginx fronts the API internally on /api) ──
  - hostname: myra.vyybandasky.online
    service: http://web:3000
  - hostname: myracleaning.vyybandasky.online      # alias -> same service
    service: http://web:3000

  # ── LaunchGear — static marketing site ──
  - hostname: lg.vyybandasky.online                # canonical
    service: http://launchgear:80
  - hostname: launchgear.vyybandasky.online        # alias -> same service
    service: http://launchgear:80

  - service: http_status:404
