# LaunchGear — static marketing site. Per LAUNCHGEAR_DEPLOY.md §2.
#
# No API, no proxying, no CORS: the page is one self-contained HTML file whose
# two demos run entirely client-side. This is the lightest form of the
# VOS/Myra pattern — one small container behind the shared tunnel.

server {
  listen 80;
  # Also bind IPv6: inside the container `localhost` resolves to ::1 first, so
  # an IPv4-only listener makes `wget -qO- localhost` fail with "connection
  # refused" even though the site is perfectly healthy. Costs nothing.
  listen [::]:80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/html text/css application/javascript image/svg+xml;

  # The page is republished by overwriting index.html, so it must never be
  # served from cache — see LAUNCHGEAR_DEPLOY.md §6.
  location = /index.html { add_header Cache-Control "no-cache"; }

  location ~* \.(svg|png|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / { try_files $uri $uri/ =404; }
}
