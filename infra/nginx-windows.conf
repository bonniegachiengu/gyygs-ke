# Myrah — native Windows nginx, PRODUCTION config for the cutover window.
#
# Proven working in the dry-run of 23 Aug 2026 on non-live ports; this file is
# that same config with production ports. Ports:
#   web        3000    (was `web` container :3000)
#   launchgear 8080    (was `launchgear` container :80 — moved off 80 so it
#                       cannot collide with anything Windows already binds)
#   api        8010    (was `api` container :8010, loopback only)
#
# THREE things had to change to leave Docker behind. All three were found by
# actually running it, not by reading the container config:
#
#   1. `resolver 127.0.0.11` DELETED. That is Docker's embedded DNS. Outside a
#      container it does not exist and nginx refuses to start.
#   2. `http://api:8010` -> `http://127.0.0.1:8010`. Docker service-name DNS is
#      gone; the upstream is a real port on this host.
#   3. `include mime.types` -> ABSOLUTE path. nginx resolves a relative include
#      against the directory of THIS file (infra/), not the -p prefix, so the
#      bare name fails with "CreateFile() .../infra/mime.types failed".
#
# Start:  C:\nginx\nginx.exe -p C:\nginx -c C:\Users\DELL\dev\gyygs.ke\infra\nginx-windows.conf
# Test :  ...same... -t
# Stop :  C:\nginx\nginx.exe -p C:\nginx -s stop

worker_processes  1;
events { worker_connections 1024; }

http {
  include       "C:/nginx/conf/mime.types";
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # These hostnames are longer than nginx's default 32-byte bucket, and it
  # refuses to start rather than truncating: "could not build
  # server_names_hash". 64 is the next step up and fits
  # `myrahcleaning.vyybandasky.online` with room to spare.
  server_names_hash_bucket_size 64;

  # ── Retired name: myra.* -> 301 -> myrah.* ──
  #
  # Required by DOMAINS.md, "Retired names -> redirect, never 404": when a
  # product is renamed the old subdomain KEEPS WORKING and 301s to the new one,
  # because links in the wild, saved WhatsApp messages and printed QR codes must
  # never hit an error. myra.* is the retired name; myrah.* is canonical.
  #
  # DOMAINS.md's preferred mechanism is a Cloudflare Redirect Rule (dashboard),
  # for the reason it gives: a real 301 tells browsers and search engines the
  # name MOVED, rather than silently serving one site on two addresses. This
  # nginx block honours that intent -- it is a real 301 preserving path and
  # query, not a second copy of the site. If the Cloudflare rule is added later,
  # delete this block; the two must not both exist.
  server {
    listen 3000;
    server_name myra.vyybandasky.online myracleaning.vyybandasky.online;
    return 301 https://myrah.vyybandasky.online$request_uri;
  }

  # ── Myrah web (SPA + /api proxy) — canonical ──
  # `default_server` so an unmatched Host (a health probe, a direct 127.0.0.1
  # hit) still gets the app rather than the redirect. Only the two retired
  # hostnames above are ever redirected.
  server {
    listen 3000 default_server;
    server_name myrah.vyybandasky.online myrahcleaning.vyybandasky.online _;
    root "C:/Users/DELL/dev/gyygs.ke/apps/web/dist";
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    set $api_upstream http://127.0.0.1:8010;

    location /api/ {
      # No trailing slash and no URI path on proxy_pass, so the /api prefix is
      # preserved for FastAPI's APIRouter(prefix="/api") mount.
      proxy_pass $api_upstream;
      proxy_http_version 1.1;

      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # Cloudflare puts the true client IP here; without it the per-IP quote
      # rate limit would throttle every visitor as one client.
      proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;

      proxy_connect_timeout 5s;
      proxy_read_timeout   30s;
    }

    # Mercy's operator board. Same origin as the API on purpose, so the board
    # has no API base URL to get wrong -- the same reasoning the calculator uses.
    #
    # The HTML itself is public; it is useless without the PIN, which every
    # /api/admin route checks server-side (require_pin). Serving it here is what
    # makes the board reachable from her phone at all -- staging has carried the
    # identical block since the board was built.
    #
    # no-store, not no-cache: this is an operator surface that changes between
    # deploys and must never be served from a stale phone cache mid-shift.
    location /admin {
      alias "C:/Users/DELL/dev/gyygs.ke/apps/admin";
      index index.html;
      try_files $uri $uri/ /admin/index.html;
      add_header Cache-Control "no-store";
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location = /index.html {
      add_header Cache-Control "no-cache";
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }

  # ── LaunchGear (static marketing site) ──
  server {
    listen 8080;
    server_name _;
    root "C:/Users/DELL/dev/gyygs.ke/apps/launchgear";
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml;

    # Republished by overwriting index.html, so it must never be cached.
    location = /index.html { add_header Cache-Control "no-cache"; }

    location ~* \.(svg|png|woff2?)$ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
  }
}
