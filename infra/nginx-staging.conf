# Myrah STAGING nginx — a second, independent instance.
#
# Ports are deliberately one above production so the two can run side by side on
# the same machine and never contend:
#
#            production   staging
#   web         3000        3001
#   launchgear  8080        (n/a — staging serves the app only)
#   api         8010        8011
#
# There is NO redirect block here. Staging is reached by exactly one hostname;
# the myra->myrah 301 is a production concern and rehearsing it here would only
# bounce testers off the environment they are trying to test.

worker_processes  1;
events { worker_connections 1024; }

http {
  include       "C:/nginx/conf/mime.types";
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  server_names_hash_bucket_size 64;

  server {
    listen 3001 default_server;
    server_name staging-myrah.vyybandasky.online _;
    root "C:/Users/DELL/dev/gyygs.ke-staging/apps/web/dist";
    index index.html;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # A banner header so anyone poking at staging can tell instantly which
    # environment answered. Cheap, and it has saved people from "why is prod
    # showing test data" more than once.
    add_header X-Myrah-Env "staging" always;

    set $api_upstream http://127.0.0.1:8011;

    location /api/ {
      proxy_pass $api_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header CF-Connecting-IP  $http_cf_connecting_ip;
      proxy_connect_timeout 5s;
      proxy_read_timeout   30s;
    }

    location /assets/ { add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /index.html { add_header Cache-Control "no-cache"; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
